name: PR Auto Merge

# Runs the trusted workflow from main without checking out PR code.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: squash-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge:
    name: Squash ready PR
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Check conflict-free mergeability, not mergeStateStatus: the in-progress
          # workflow itself can make mergeStateStatus UNSTABLE.
          for attempt in 1 2 3 4 5; do
            pr="$(gh pr view "$PR_NUMBER" --json state,isDraft,headRefOid,reviewDecision,mergeable)"
            mergeability="$(jq -r '.mergeable' <<<"$pr")"
            if [ "$mergeability" != "UNKNOWN" ]; then
              break
            fi
            sleep 3
          done

          if [ "$(jq -r '.state' <<<"$pr")" != "OPEN" ] ||
             [ "$(jq -r '.isDraft' <<<"$pr")" != "false" ]; then
            echo "PR is not open and ready; skipping."
            exit 0
          fi

          head_sha="$(jq -r '.headRefOid' <<<"$pr")"
          if [ "$head_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "PR head changed after this event; skipping stale merge."
            exit 0
          fi

          review_decision="$(jq -r '.reviewDecision // ""' <<<"$pr")"
          if [ "$review_decision" = "CHANGES_REQUESTED" ] ||
             [ "$review_decision" = "REVIEW_REQUIRED" ]; then
            echo "Review must be completed before merging."
            exit 0
          fi

          # Keep the former ruleset's unresolved-review-thread safety gate.
          threads="$(gh api graphql \
            -f query='query($owner: String!, $name: String!, $number: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $number) { reviewThreads(first: 100) { nodes { isResolved } pageInfo { hasNextPage } } } } }' \
            -f owner="${GH_REPO%%/*}" \
            -f name="${GH_REPO#*/}" \
            -F number="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.reviewThreads')"
          if [ "$threads" = "null" ]; then
            echo "Unable to inspect review threads; refusing to merge." >&2
            exit 1
          fi
          if jq -e '.pageInfo.hasNextPage or ([.nodes[].isResolved] | any(. == false))' <<<"$threads" > /dev/null; then
            echo "PR has unresolved or uninspected review threads; skipping."
            exit 0
          fi

          if [ "$mergeability" != "MERGEABLE" ]; then
            echo "PR is $mergeability, not MERGEABLE; skipping."
            exit 0
          fi

          # Immediate API merge works on private GitHub Free repositories.
          # Do not use 'gh pr merge --auto': that feature requires paid branch protection.
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$head_sha"
