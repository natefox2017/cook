name: iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ios-check:
    name: Validate iOS project
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Swift environment
        run: |
          xcodebuild -version
          swift --version
      - name: Test recipe data, persistence, parsing, and timers
        run: swift test --package-path ios/CookCore
      - name: Build iOS app and run UI flows
        run: |
          set -o pipefail
          xcodebuild -project ios/Cook.xcodeproj -scheme Cook \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max,OS=26.2' \
            -resultBundlePath TestResults/Cook.xcresult \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ios-test.log
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d TestResults/Cook.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path TestResults/Cook.xcresult \
              --output-path TestResults/Screenshots
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cook-ios-validation
          path: |
            TestResults/Cook.xcresult
            ios-test.log
          if-no-files-found: ignore
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cook-ui-screenshots
          path: TestResults/Screenshots
          if-no-files-found: ignore
