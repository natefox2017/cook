<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1050" viewBox="0 0 1540 1050" role="img" aria-labelledby="title desc">
  <title id="title">Cook cloud sync design proposal</title>
  <desc id="desc">Three iPhone screens show cloud sync status, first sync choices, and conflict handling.</desc>
  <defs>
    <style>
      .device{fill:#181a18}.screen{fill:#f8f7f1}.card{fill:#fff}.green{fill:#216b42}.muted{fill:#747873}.line{stroke:#e4e5df;stroke-width:1.5}.title{font:600 31px 'Lora',Georgia,serif;fill:#171917}.heading{font:600 20px 'Lora',Georgia,serif;fill:#171917}.body{font:16px 'Lora',Georgia,serif;fill:#252925}.small{font:13px 'Lora',Georgia,serif;fill:#747873}.button{font:600 15px 'Lora',Georgia,serif;fill:#fff}.label{font:600 13px 'Lora',Georgia,serif;fill:#747873;letter-spacing:.4px}
    </style>
  </defs>
  <rect width="1540" height="1050" fill="#efeee8"/>
  <text x="55" y="55" class="title">Cloud Sync · Proposed states</text>
  <text x="55" y="82" class="small">Existing Cook settings style · Lora · #42A85A accent · native iOS layout</text>
  <g transform="translate(45 120)">
    <rect width="340" height="810" rx="42" class="device"/>
    <rect x="9" y="9" width="322" height="792" rx="35" class="screen"/>
    <rect x="121" y="20" width="98" height="24" rx="12" fill="#101110"/>
    <text x="31" y="85" class="small">9:41</text><circle cx="293" cy="78" r="7" fill="#171917"/><rect x="305" y="72" width="16" height="12" rx="3" fill="#171917"/>
    <text x="28" y="152" class="title">Cloud Sync</text>
    <text x="28" y="190" class="label">ACCOUNT</text>
    <rect x="20" y="205" width="300" height="86" rx="21" class="card"/>
    <circle cx="53" cy="248" r="18" fill="#e4f1e5"/><path d="M45 250a9 9 0 0 1 17-4M61 246l1 7-6-2" fill="none" stroke="#216b42" stroke-width="2.5" stroke-linecap="round"/>
    <text x="82" y="243" class="heading">Connected</text><text x="82" y="266" class="small">Cook account</text>
    <text x="28" y="335" class="label">SYNC STATUS</text>
    <rect x="20" y="350" width="300" height="120" rx="21" class="card"/>
    <circle cx="48" cy="389" r="6" fill="#42a85a"/><text x="65" y="395" class="body">Up to date</text>
    <text x="42" y="427" class="small">Last synced today at 10:25 AM</text>
    <rect x="42" y="443" width="256" height="1" class="line"/>
    <text x="28" y="514" class="label">SYNC BEHAVIOR</text>
    <rect x="20" y="529" width="300" height="148" rx="21" class="card"/>
    <text x="42" y="566" class="body">Update</text><text x="42" y="589" class="small">Choose when Cook syncs</text>
    <text x="42" y="632" class="body">Automatic</text><text x="290" y="632" text-anchor="end" class="green body">⌄</text>
    <rect x="42" y="650" width="256" height="1" class="line"/>
    <rect x="24" y="704" width="292" height="54" rx="27" fill="#42a85a"/><text x="170" y="738" text-anchor="middle" class="button">Sync Now</text>
    <text x="170" y="779" text-anchor="middle" class="small">A failed sync keeps your local library safe.</text>
    <text x="170" y="865" text-anchor="middle" class="heading">1 · Status and retry</text>
  </g>
  <g transform="translate(415 120)">
    <rect width="340" height="810" rx="42" class="device"/>
    <rect x="9" y="9" width="322" height="792" rx="35" class="screen"/>
    <rect x="121" y="20" width="98" height="24" rx="12" fill="#101110"/>
    <text x="31" y="85" class="small">9:41</text><circle cx="293" cy="78" r="7" fill="#171917"/><rect x="305" y="72" width="16" height="12" rx="3" fill="#171917"/>
    <text x="28" y="152" class="title">Cloud Sync</text>
    <rect x="20" y="184" width="300" height="560" rx="24" fill="#20221f" opacity=".24"/>
    <rect x="20" y="394" width="300" height="350" rx="24" class="card"/>
    <rect x="151" y="408" width="38" height="4" rx="2" fill="#d7d8d2"/>
    <text x="42" y="455" class="heading">Choose what to do</text>
    <text x="42" y="485" class="small">There is data on this device and in your</text>
    <text x="42" y="505" class="small">Cook account. Keep both copies safe.</text>
    <rect x="42" y="532" width="256" height="64" rx="16" fill="#f4f6f1"/>
    <text x="58" y="558" class="body">On this device</text><text x="58" y="579" class="small">12 recipes · 4 grocery items</text>
    <rect x="42" y="606" width="256" height="64" rx="16" fill="#f4f6f1"/>
    <text x="58" y="632" class="body">Cook account</text><text x="58" y="653" class="small">8 recipes · 2 planned meals</text>
    <rect x="42" y="686" width="256" height="46" rx="23" fill="#42a85a"/><text x="170" y="716" text-anchor="middle" class="button">Merge libraries</text>
    <text x="170" y="764" text-anchor="middle" class="green body">Keep local data for later</text>
    <text x="170" y="865" text-anchor="middle" class="heading">2 · First sync choice</text>
  </g>
  <g transform="translate(785 120)">
    <rect width="340" height="810" rx="42" class="device"/>
    <rect x="9" y="9" width="322" height="792" rx="35" class="screen"/>
    <rect x="121" y="20" width="98" height="24" rx="12" fill="#101110"/>
    <text x="31" y="85" class="small">9:41</text><circle cx="293" cy="78" r="7" fill="#171917"/><rect x="305" y="72" width="16" height="12" rx="3" fill="#171917"/>
    <text x="28" y="152" class="title">Sync conflict</text>
    <text x="28" y="187" class="small">Another device saved a newer version.</text>
    <rect x="20" y="215" width="300" height="100" rx="21" class="card"/>
    <text x="42" y="251" class="label">THIS DEVICE</text><text x="42" y="281" class="body">Edited 3 recipes · 2 groceries</text>
    <rect x="20" y="331" width="300" height="100" rx="21" class="card"/>
    <text x="42" y="367" class="label">COOK ACCOUNT</text><text x="42" y="397" class="body">Edited 1 recipe · 1 planned meal</text>
    <text x="28" y="481" class="heading">Keep the libraries safe</text>
    <text x="28" y="511" class="small">Merge non-conflicting changes. If the same</text>
    <text x="28" y="531" class="small">item changed twice, choose which version to keep.</text>
    <rect x="20" y="564" width="300" height="58" rx="29" fill="#42a85a"/><text x="170" y="600" text-anchor="middle" class="button">Review and merge</text>
    <rect x="20" y="640" width="300" height="58" rx="29" fill="#fff" stroke="#d7d9d2"/><text x="170" y="676" text-anchor="middle" class="body">Retry with this device's copy</text>
    <text x="170" y="865" text-anchor="middle" class="heading">3 · Conflict resolution</text>
  </g>
  <g transform="translate(1155 120)">
    <rect width="340" height="810" rx="42" class="device"/>
    <rect x="9" y="9" width="322" height="792" rx="35" class="screen"/>
    <rect x="121" y="20" width="98" height="24" rx="12" fill="#101110"/>
    <text x="31" y="85" class="small">9:41</text><circle cx="293" cy="78" r="7" fill="#171917"/><rect x="305" y="72" width="16" height="12" rx="3" fill="#171917"/>
    <text x="28" y="152" class="title">Delete account</text>
    <rect x="20" y="190" width="300" height="158" rx="21" class="card"/>
    <text x="42" y="231" class="heading">What will be removed</text>
    <text x="42" y="267" class="body">Your Cook account and its cloud</text>
    <text x="42" y="291" class="body">recipes, plans, and uploaded files.</text>
    <text x="42" y="327" class="small">This cannot be undone.</text>
    <rect x="20" y="370" width="300" height="118" rx="21" fill="#e8f2e8"/>
    <text x="42" y="411" class="heading">This device</text>
    <text x="42" y="444" class="body">Your local library stays on this device.</text>
    <text x="42" y="468" class="small">Delete it separately in Data &amp; Privacy.</text>
    <rect x="24" y="548" width="292" height="54" rx="27" fill="#bb3030"/><text x="170" y="582" text-anchor="middle" class="button">Delete Account &amp; Cloud Data</text>
    <text x="170" y="637" text-anchor="middle" class="green body">Cancel</text>
    <rect x="20" y="683" width="300" height="1" class="line"/>
    <text x="170" y="721" text-anchor="middle" class="small">No App Store subscription is cancelled.</text>
    <text x="170" y="865" text-anchor="middle" class="heading">4 · Account deletion</text>
  </g>
  <text x="55" y="985" class="small">Deletion confirmation remains a separate pending state; account removal never implies local-library removal.</text>
</svg>
