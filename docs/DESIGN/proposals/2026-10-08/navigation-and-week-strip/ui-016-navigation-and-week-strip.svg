<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".76"/>
      <stop offset=".5" stop-color="#f8f8f7" stop-opacity=".62"/>
      <stop offset="1" stop-color="#e9e9e7" stop-opacity=".74"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".28"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1280" height="940" fill="#f4f2ec"/>
  <text x="72" y="78" fill="#1d2820" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="700">Recipe · UI-016</text>
  <text x="72" y="116" fill="#68716a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19">Compact week strip + native Liquid Glass tab navigation</text>

  <!-- Week selector -->
  <rect x="64" y="154" width="1152" height="330" rx="28" fill="#fff"/>
  <text x="100" y="202" fill="#737a74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" letter-spacing="1">MEAL PLAN · WEEK SELECTOR</text>
  <text x="100" y="252" fill="#18231c" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="650">Oct 4 – Oct 10, 2026</text>
  <text x="100" y="292" fill="#747a75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">Seven compact day cards; date and meal marker remain visible.</text>
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">
    <g transform="translate(102 320)">
      <rect width="116" height="104" rx="21" fill="#f6f6f4"/>
      <text x="58" y="34" font-size="15" fill="#333a35">Sun</text><text x="58" y="72" font-size="27" font-weight="650" fill="#18231c">4</text><circle cx="58" cy="89" r="2.5" fill="#42a85a"/>
    </g>
    <g transform="translate(230 320)">
      <rect width="116" height="104" rx="21" fill="#f6f6f4"/>
      <text x="58" y="34" font-size="15" fill="#333a35">Mon</text><text x="58" y="72" font-size="27" font-weight="650" fill="#18231c">5</text>
    </g>
    <g transform="translate(358 320)">
      <rect width="116" height="104" rx="21" fill="#f6f6f4"/>
      <text x="58" y="34" font-size="15" fill="#333a35">Tue</text><text x="58" y="72" font-size="27" font-weight="650" fill="#18231c">6</text>
    </g>
    <g transform="translate(486 320)">
      <rect width="116" height="104" rx="21" fill="#f6f6f4"/>
      <text x="58" y="34" font-size="15" fill="#333a35">Wed</text><text x="58" y="72" font-size="27" font-weight="650" fill="#18231c">7</text>
    </g>
    <g transform="translate(614 312)">
      <rect width="116" height="112" rx="23" fill="#00ae55"/>
      <text x="58" y="35" font-size="15" fill="#fff">Thu</text><text x="58" y="75" font-size="27" font-weight="650" fill="#fff">8</text><circle cx="58" cy="95" r="2.5" fill="#fff"/>
    </g>
    <g transform="translate(742 320)">
      <rect width="116" height="104" rx="21" fill="#f6f6f4"/>
      <text x="58" y="34" font-size="15" fill="#333a35">Fri</text><text x="58" y="72" font-size="27" font-weight="650" fill="#18231c">9</text>
    </g>
    <g transform="translate(870 320)">
      <rect width="116" height="104" rx="21" fill="#f6f6f4"/>
      <text x="58" y="34" font-size="15" fill="#333a35">Sat</text><text x="58" y="72" font-size="27" font-weight="650" fill="#18231c">10</text>
    </g>
  </g>
  <text x="1020" y="354" fill="#216b42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="600">60–64 pt target</text>
  <text x="1020" y="382" fill="#747a75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">44 pt minimum touch area</text>

  <!-- Content and native tab bar -->
  <rect x="64" y="520" width="1152" height="354" rx="28" fill="#fff"/>
  <text x="100" y="568" fill="#737a74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" letter-spacing="1">BOTTOM NAVIGATION · iOS 26+</text>
  <text x="100" y="614" fill="#18231c" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="650">Native TabView owns the bar and safe area</text>
  <text x="100" y="650" fill="#747a75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">Page content scrolls to a clear resting position above the floating controls.</text>
  <rect x="100" y="686" width="1080" height="1" fill="#e7e8e4"/>
  <text x="110" y="714" fill="#68716a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">Content layer</text>
  <rect x="100" y="724" width="1080" height="52" rx="16" fill="#f7f6f2"/>
  <text x="128" y="756" fill="#252d27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17">Last recipe row / meal action stays fully reachable above the tab bar</text>
  <ellipse cx="640" cy="831" rx="445" ry="27" fill="#7e827d" opacity=".16" filter="url(#shadow)"/>
  <rect x="190" y="785" width="900" height="86" rx="43" fill="url(#glass)" stroke="#cbd0cc" stroke-width="1.4"/>
  <rect x="193" y="787" width="894" height="80" rx="40" fill="url(#shine)" opacity=".55"/>
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">
    <g transform="translate(240 805)">
      <path d="M-10 7V-15h13a5 5 0 0 1 5 5V9H-5a5 5 0 0 0-5-2Zm0 0a5 5 0 0 1 5-5H8" fill="none" stroke="#272d29" stroke-width="2.5" stroke-linejoin="round"/><text x="0" y="61" font-size="13" fill="#353b37">Recipes</text>
    </g>
    <g transform="translate(420 805)">
      <rect x="-75" y="-2" width="150" height="72" rx="36" fill="#dfe2de" opacity=".76"/>
      <rect x="-11" y="-16" width="22" height="23" rx="3" fill="none" stroke="#216b42" stroke-width="2.5"/><path d="M-6-19v6M6-19v6M-7-8h3M0-8h3M-7-2h3M0-2h3" fill="none" stroke="#216b42" stroke-width="2.2" stroke-linecap="round"/><text x="0" y="61" font-size="13" fill="#216b42" font-weight="600">Plan</text>
    </g>
    <g transform="translate(600 805)">
      <path d="M-13-3h26l-3 13h-20Zm-2-3h30M-7-6l7-10 7 10M-6 1v5M0 1v5M6 1v5" fill="none" stroke="#272d29" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/><text x="0" y="61" font-size="13" fill="#353b37">Groceries</text>
    </g>
    <g transform="translate(780 805)">
      <circle cx="0" cy="-10" r="11" fill="none" stroke="#272d29" stroke-width="2.3"/><circle cx="0" cy="-13" r="3.5" fill="#272d29"/><path d="M-7-4c1-6 13-6 14 0" fill="#272d29"/><text x="0" y="61" font-size="13" fill="#353b37">Profile</text>
    </g>
  </g>
  <text x="100" y="912" fill="#737a74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">System material, reflection, tinting, motion, and safe-area behavior are provided by iOS; this illustration is a direction preview, not a pixel-accurate OS render.</text>
</svg>
