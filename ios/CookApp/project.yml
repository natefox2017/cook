name: Cook
options:
  bundleIdPrefix: com.modelhub
  deploymentTarget: { iOS: "18.0" }
settings:
  base: { SWIFT_VERSION: "6.0" }
targets:
  Cook:
    type: application
    platform: iOS
    sources: [{ path: Sources }]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.modelhub.cook
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cook
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import recipe photos.
    scheme: { testTargets: [CookTests] }
  CookTests:
    type: bundle.unit-test
    platform: iOS
    sources: [{ path: Tests }]
    dependencies: [{ target: Cook }]
