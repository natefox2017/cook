# Developer: gengyun
# Purpose: Keep import API user-authenticated and cron worker secret-authenticated.
# This is a focused function configuration; no API/provider secrets live here.

[functions.health]
# Authenticated status: no remote runtime module imports.
verify_jwt = true

[functions.openapi]
# The bundled repository-scoped API contract is public and contains no secrets.
verify_jwt = false

[functions.delete-account]
# Account deletion always requires a verified Supabase Auth user JWT.
verify_jwt = true

[functions.admin-auth]
# Uses separate admin bearer sessions and server-only service credentials.
# Its handler verifies its own admin tokens and bootstrap authorization.
verify_jwt = false

[functions.admin-users]
# Uses the custom admin session checked by the handler, not a Supabase user JWT.
verify_jwt = false

[functions.admin-subscriptions]
# Uses the custom admin session checked by the handler, not a Supabase user JWT.
verify_jwt = false

[functions.admin-dashboard]
# Uses the custom admin session checked by the handler, not a Supabase user JWT.
verify_jwt = false

[functions.recipe-imports]
verify_jwt = true

[functions.recipe-import-artifacts]
verify_jwt = true

[functions.recipe-import-worker]
# Worker authenticates an explicit high-entropy server-side secret itself.
# Do not expose the secret to iOS or any public client.
verify_jwt = false

[functions.purge-expired-recipe-import-artifacts]
# Uses its own high-entropy bearer secret; never put it in the iOS app.
verify_jwt = false
